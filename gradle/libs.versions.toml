[versions]
kotlin = "2.4.21"
guava = "33.5.0-jre"
tapmoc = "0.4.2"
prepared = "2.6.0"
kotlinx-coroutines = "1.11.0"
testballoon = "1.1.0"

[libraries]
kotlinx-coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug", version.ref = "kotlinx-coroutines" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
testballoon-framework-core = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "testballoon" }
prepared-suite = { module = "dev.opensavvy.prepared:suite", version.ref = "prepared" }
prepared-runner-testballoon = { module = "dev.opensavvy.prepared:runner-testballoon", version.ref = "prepared" }
prepared-compat-ktor = { module = "dev.opensavvy.prepared:compat-ktor", version.ref = "prepared" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-powerAssert = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "kotlin" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }
testballoon = { id = "de.infix.testBalloon", version.ref = "testballoon" }
